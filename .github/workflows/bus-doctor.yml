# Generated by tools/target_workflows.py from .github/workflows/bus-doctor.yml in the bus release; do not edit.
# Runs in this target. The bus source is checked out read-only at a pinned revision.
name: Bus doctor
run-name: Bus doctor ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique caller correlation id
        required: true
      capability:
        description: source-review, native-issue-effects, autonomous-code-repair, destination-acceptance or watch
        required: true
        default: native-issue-effects
      targets:
        description: Comma-separated registered owner/repo targets
        required: true
permissions:
  contents: read
  issues: read
env:
  ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - name: Require full approved executor source
      env:
        REVISION: ${{ vars.ONTOLIBRARY_COM_X_BUS_EXECUTOR_REVISION }}
      run: '[[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]'
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ vars.ONTOLIBRARY_COM_X_BUS_EXECUTOR_REVISION }}
        persist-credentials: false
    - name: Assemble presence-only metadata and ephemeral native inventory keys
      env:
        ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_GROK_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GROK_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_GEMINI_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GEMINI_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_GROK_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GROK_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_GEMINI_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GEMINI_APP_PRIVATE_KEY }}
        REVISION: ${{ vars.ONTOLIBRARY_COM_X_BUS_EXECUTOR_REVISION }}
        PROJECT: ${{ vars.ONTOLIBRARY_COM_X_BUS_PROJECT_SLUG }}
        ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
      run: |
        python3 - <<'PY'
        import json,os,pathlib
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ontolibrary-com-x-bus-native-keys';root.mkdir(mode=0o700)
        names=['ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN','OPENAI_API_KEY','ANTHROPIC_API_KEY','XAI_API_KEY','GEMINI_API_KEY']
        for actor in ['CHATGPT','CLAUDE','GROK','GEMINI']:
            names += ['ONTOLIBRARY_COM_X_BUS_'+actor+'_APP_ID','ONTOLIBRARY_COM_X_BUS_'+actor+'_APP_PRIVATE_KEY']
            name='ONTOLIBRARY_COM_X_BUS_'+actor+'_APP_PRIVATE_KEY'
            if os.environ.get(name):
                path=root/('ontolibrary.com_x-bus_'+actor.lower()+'.pem');path.write_text(os.environ[name]);path.chmod(0o600)
        data={'secrets':[{'name':n} for n in names if os.environ.get(n)],'variables':[{'name':'ONTOLIBRARY_COM_X_BUS_EXECUTOR_REVISION','value':os.environ['REVISION']},{'name':'ONTOLIBRARY_COM_X_BUS_PROJECT_SLUG','value':os.environ['PROJECT']}]}
        pathlib.Path('inventory.json').write_text(json.dumps(data))
        PY
    - name: Run the same read-only doctor and native permission checks
      env:
        ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        CAPABILITY: ${{ inputs.capability }}
        TARGETS: ${{ inputs.targets }}
      run: |
        python3 - <<'PY'
        import os,re,subprocess,sys
        targets=os.environ['TARGETS'].split(',')
        if len(targets)>4 or not all(re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',t) for t in targets):raise SystemExit(2)
        argv=['python3','tools/bus_doctor.py','--live',os.environ['GITHUB_REPOSITORY'],'--inventory','inventory.json','--app-key-dir',os.environ['RUNNER_TEMP']+'/ontolibrary-com-x-bus-native-keys','--require',os.environ['CAPABILITY']]
        for target in targets:argv+=['--target',target]
        result=subprocess.run(argv,capture_output=True,text=True);print(result.stdout);open('doctor.json','w').write(result.stdout)
        raise SystemExit(result.returncode)
        PY
    - name: Retain redacted readiness evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: doctor-${{ inputs.request_id }}
        path: doctor.json
        if-no-files-found: warn
    - name: Remove ephemeral App private keys
      if: always()
      run: rm -rf "$RUNNER_TEMP/ontolibrary-com-x-bus-native-keys"
