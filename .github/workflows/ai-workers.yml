# Generated by tools/target_workflows.py from .github/workflows/ai-workers.yml in the bus release; do not edit.
# Runs in this target. The bus source is checked out read-only at a pinned revision.
name: Governed AI workers
run-name: AI workers request ${{ github.event.after || inputs.request_sha }}
permissions: {}
concurrency:
  group: governed-ai-workers-${{ inputs.request_sha || github.sha }}
  cancel-in-progress: false
'on':
  push:
    branches:
    - main
    paths:
    - automation/worker-requests/*.json
  workflow_dispatch:
    inputs:
      request_sha:
        description: Full commit adding exactly one attributed worker request
        required: true
env:
  ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
  ONTOLIBRARY_COM_X_BUS_INSTALLED: ${{ vars.ONTOLIBRARY_COM_X_BUS_INSTALLED }}
  ONTOLIBRARY_COM_X_BUS_PENDING_INSTALL: ${{ vars.ONTOLIBRARY_COM_X_BUS_PENDING_INSTALL }}
  ONTOLIBRARY_COM_X_BUS_LEDGER_ANCHOR: ${{ vars.ONTOLIBRARY_COM_X_BUS_LEDGER_ANCHOR }}
  ONTOLIBRARY_COM_X_BUS_BINDING: ${{ vars.ONTOLIBRARY_COM_X_BUS_BINDING }}
jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.context.outputs.matrix }}
      revision: ${{ steps.context.outputs.revision }}
    steps:
    - name: Validate the operator-approved executor pin
      id: trust
      env:
        REVISION: ${{ vars.ONTOLIBRARY_COM_X_BUS_EXECUTOR_REVISION }}
      run: |
        [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
        echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
    - name: Read immutable reviewed worker implementation
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ steps.trust.outputs.revision }}
        path: harness
        persist-credentials: false
    - name: Read operator-approved effect gate
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ steps.trust.outputs.revision }}
        path: executor
        persist-credentials: false
    - name: Validate request and assemble exact-commit source context
      id: context
      env:
        READ_GH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        TRUSTED_EXECUTOR_REVISION: ${{ steps.trust.outputs.revision }}
        WORKER_REQUEST_SHA: ${{ inputs.request_sha || github.sha }}
      run: |
        python3.12 harness/tools/ai_worker.py prepare --executor-root "$GITHUB_WORKSPACE/executor" --context input/context.json
        cp harness/tools/ai_worker.py input/worker.py
        cp harness/tools/ai_worker.py input/ai_worker.py
        cp harness/tools/roles.py input/
        cp harness/tools/smoke_profiles.py harness/tools/loop_state.py harness/tools/watch_check.py input/
        mkdir -p input/config
        cp harness/config/smoke-profiles.json input/config/
        cp harness/config/automation-bindings.json input/config/
        env -i PATH="$PATH" LANG=C.UTF-8 ONTOLIBRARY_COM_X_BUS_ROLES="$ONTOLIBRARY_COM_X_BUS_ROLES" python3.12 input/worker.py check --context input/context.json
    - name: Verify native publisher access and declared credentials before paid calls
      env:
        TRUSTED_EXECUTOR_REVISION: ${{ steps.trust.outputs.revision }}
        ONTOLIBRARY_COM_X_BUS_PROJECT_SLUG: ${{ vars.ONTOLIBRARY_COM_X_BUS_PROJECT_SLUG }}
        ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
        ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_GROK_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GROK_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_GEMINI_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GEMINI_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_GROK_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GROK_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_GEMINI_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GEMINI_APP_PRIVATE_KEY }}
      run: python3.12 harness/tools/runtime_preflight.py --root "$GITHUB_WORKSPACE/executor" --context input/context.json
    - name: Transfer source data and fixed worker to isolated model jobs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: worker-input-${{ github.run_attempt }}
        path: input/
        if-no-files-found: error
        retention-days: 30
  model:
    needs:
    - prepare
    - reserve
    permissions: {}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - name: Receive bounded source context from this run
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: worker-input-${{ github.run_attempt }}
        path: input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: worker-lease-${{ matrix.actor }}-${{ github.run_attempt }}
        path: input
    - name: Call only the selected model provider
      env:
        ACTOR: ${{ matrix.actor }}
        ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
        PROVIDER_API_KEY: ${{ secrets[fromJSON(vars.ONTOLIBRARY_COM_X_BUS_ROLES).agents[matrix.actor].credential] }}
      run: |
        env -i PATH="$PATH" LANG=C.UTF-8 GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" ONTOLIBRARY_COM_X_BUS_ROLES="$ONTOLIBRARY_COM_X_BUS_ROLES" PROVIDER_API_KEY="$PROVIDER_API_KEY" python3.12 input/worker.py plan --actor "$ACTOR" --context input/context.json --result output/result.json
    - name: Transfer bounded model result as data
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: worker-result-${{ matrix.actor }}-${{ github.run_attempt }}
        path: output/result.json
        if-no-files-found: error
        retention-days: 30
    - name: Fail visibly when the selected provider is blocked
      env:
        ACTOR: ${{ matrix.actor }}
      run: python3.12 input/worker.py inspect --actor "$ACTOR" --context input/context.json --result output/result.json
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
  publish:
    concurrency:
      group: ontolibrary-com-x-bus-effects-${{ github.repository }}-${{ matrix.actor }}
      queue: max
      cancel-in-progress: false
    needs:
    - prepare
    - model
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: read
      issues: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Read immutable reviewed publication controller
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ needs.prepare.outputs.revision }}
        path: harness
        persist-credentials: false
    - name: Read approved effect gate
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ needs.prepare.outputs.revision }}
        path: executor
        persist-credentials: false
    - name: Receive original context
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: worker-input-${{ github.run_attempt }}
        path: input
    - name: Receive selected model result
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: worker-result-${{ matrix.actor }}-${{ github.run_attempt }}
        path: output
    - name: Require a valid completed model result before any App credential
      env:
        ACTOR: ${{ matrix.actor }}
      run: python3.12 harness/tools/ai_worker.py inspect --actor "$ACTOR" --context input/context.json --result output/result.json
    - name: Install approved hash-locked semantic requirements
      run: python3.12 -m pip install --require-hashes -r executor/requirements-automation.lock
    - name: Mint only this actual author's bus-scoped publisher credential
      id: app
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_ID', fromJSON('{"chatgpt":"CHATGPT","claude":"CLAUDE","grok":"GROK","gemini":"GEMINI"}')[matrix.actor])] }}
        private-key: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_PRIVATE_KEY', fromJSON('{"chatgpt":"CHATGPT","claude":"CLAUDE","grok":"GROK","gemini":"GEMINI"}')[matrix.actor])] }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
    - name: Publish the actual model finding through the approved gate
      env:
        ACTOR: ${{ matrix.actor }}
        TRUSTED_EXECUTOR_REVISION: ${{ needs.prepare.outputs.revision }}
        READ_GH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        EXECUTOR_GH_TOKEN: ${{ steps.app.outputs.token }}
      run: python3.12 harness/tools/ai_worker.py publish --executor-root "$GITHUB_WORKSPACE/executor" --actor "$ACTOR" --context input/context.json --result output/result.json
  reserve:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: ontolibrary-com-x-bus-effects-${{ github.repository }}-${{ matrix.actor }}
      queue: max
      cancel-in-progress: false
    steps:
    - name: Read immutable reviewed publication controller
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ needs.prepare.outputs.revision }}
        path: harness
        persist-credentials: false
    - name: Read approved effect gate
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ needs.prepare.outputs.revision }}
        path: executor
        persist-credentials: false
    - name: Receive original context
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: worker-input-${{ github.run_attempt }}
        path: input
    - name: Install approved hash-locked semantic requirements
      run: python3.12 -m pip install --require-hashes -r executor/requirements-automation.lock
    - name: Mint only this actual author's bus-scoped publisher credential
      id: app
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_ID', fromJSON('{"chatgpt":"CHATGPT","claude":"CLAUDE","grok":"GROK","gemini":"GEMINI"}')[matrix.actor])] }}
        private-key: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_PRIVATE_KEY', fromJSON('{"chatgpt":"CHATGPT","claude":"CLAUDE","grok":"GROK","gemini":"GEMINI"}')[matrix.actor])] }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
    - name: Reserve one paid inference or recover its original output
      env:
        ACTOR: ${{ matrix.actor }}
        TRUSTED_EXECUTOR_REVISION: ${{ needs.prepare.outputs.revision }}
        READ_GH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        EXECUTOR_GH_TOKEN: ${{ steps.app.outputs.token }}
      run: python3.12 harness/tools/ai_worker.py reserve --executor-root "$GITHUB_WORKSPACE/executor" --actor "$ACTOR" --context input/context.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: worker-lease-${{ matrix.actor }}-${{ github.run_attempt }}
        path: output/model-lease.json
        if-no-files-found: error
