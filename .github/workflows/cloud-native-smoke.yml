# Generated by tools/target_workflows.py from .github/workflows/cloud-native-smoke.yml in the bus release; do not edit.
# Runs in this target. The bus source is checked out read-only at a pinned revision.
name: Cloud native smoke
run-name: Cloud native smoke request ${{ github.event.after || inputs.request_sha }}
'on':
  push:
    branches:
    - main
    paths:
    - automation/smoke-requests/*.json
  workflow_dispatch:
    inputs:
      request_sha:
        description: Immutable commit authoring exactly one smoke request file
        required: true
      request_path:
        description: Optional exact automation/smoke-requests/<name>.json path
        required: false
permissions:
  contents: read
  issues: read
concurrency:
  group: cloud-native-smoke
  cancel-in-progress: false
env:
  ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
  ONTOLIBRARY_COM_X_BUS_INSTALLED: ${{ vars.ONTOLIBRARY_COM_X_BUS_INSTALLED }}
  ONTOLIBRARY_COM_X_BUS_PENDING_INSTALL: ${{ vars.ONTOLIBRARY_COM_X_BUS_PENDING_INSTALL }}
  ONTOLIBRARY_COM_X_BUS_LEDGER_ANCHOR: ${{ vars.ONTOLIBRARY_COM_X_BUS_LEDGER_ANCHOR }}
  ONTOLIBRARY_COM_X_BUS_BINDING: ${{ vars.ONTOLIBRARY_COM_X_BUS_BINDING }}
jobs:
  smoke:
    concurrency:
      group: ontolibrary-com-x-bus-effects-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Capture the approved executor revision once
      id: trust
      env:
        TRUSTED: ${{ vars.ONTOLIBRARY_COM_X_BUS_EXECUTOR_REVISION }}
      run: |
        [[ "$TRUSTED" =~ ^[0-9a-f]{40}$ ]] || { echo "Approved executor revision is absent; no App token minted."; exit 1; }
        echo "revision=$TRUSTED" >> "$GITHUB_OUTPUT"
    - name: Read immutable reviewed smoke harness
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ steps.trust.outputs.revision }}
        path: harness
        persist-credentials: false
    - name: Read operator-approved executor
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ steps.trust.outputs.revision }}
        path: executor
        persist-credentials: false
    - name: Validate bounded immutable request before App credentials
      env:
        TRUSTED_EXECUTOR_REVISION: ${{ steps.trust.outputs.revision }}
        READ_GH_TOKEN: ${{ github.token }}
        SMOKE_REQUEST_SHA: ${{ inputs.request_sha || github.sha }}
        SMOKE_REQUEST_PATH: ${{ inputs.request_path }}
      run: python3.12 harness/tools/cloud_smoke.py --executor-root "$GITHUB_WORKSPACE/executor" --validate-only
    - name: Install approved hash-locked semantic dependencies
      run: python3.12 -m pip install --require-hashes -r executor/requirements-automation.lock
    - name: Mint ChatGPT bus-scoped test token
      id: chatgpt
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_ID }}
        private-key: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-issues: write
    - name: Mint Claude bus-scoped test token
      id: claude
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_ID }}
        private-key: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-issues: write
    - name: Mint Grok bus-scoped test token
      id: grok
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GROK_APP_ID }}
        private-key: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GROK_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-issues: write
    - name: Mint Gemini bus-scoped test token
      id: gemini
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GEMINI_APP_ID }}
        private-key: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GEMINI_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-issues: write
    - name: Exercise native Apps through the approved effect gate
      env:
        TRUSTED_EXECUTOR_REVISION: ${{ steps.trust.outputs.revision }}
        READ_GH_TOKEN: ${{ github.token }}
        SMOKE_REQUEST_SHA: ${{ inputs.request_sha || github.sha }}
        SMOKE_REQUEST_PATH: ${{ inputs.request_path }}
        SMOKE_CHATGPT_TOKEN: ${{ steps.chatgpt.outputs.token }}
        SMOKE_CLAUDE_TOKEN: ${{ steps.claude.outputs.token }}
        SMOKE_GROK_TOKEN: ${{ steps.grok.outputs.token }}
        SMOKE_GEMINI_TOKEN: ${{ steps.gemini.outputs.token }}
      run: python3.12 harness/tools/cloud_smoke.py --executor-root "$GITHUB_WORKSPACE/executor"
