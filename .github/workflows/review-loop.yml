# Generated by tools/target_workflows.py from .github/workflows/review-loop.yml in the bus release; do not edit.
# Runs in this target. The bus source is checked out read-only at a pinned revision.
name: Governed review and correction loop
run-name: Review loop ${{ inputs.request_sha || github.event.client_payload.request_sha || github.event.after }} stage ${{ inputs.sequence || github.event.client_payload.sequence || 0 }}
permissions: {}
concurrency:
  group: governed-loop-stage-${{ github.repository }}
  queue: max
  cancel-in-progress: false
'on':
  repository_dispatch:
    types:
    - ontolibrary-loop-stage
  push:
    branches:
    - main
    paths:
    - automation/loop-requests/*.json
    - automation/receipts/lp-*-event.json
  workflow_dispatch:
    inputs:
      request_sha:
        description: Original immutable one-file loop request commit
        required: true
      sequence:
        description: Exact journal sequence; stale deliveries do no work
        default: '0'
        required: true
      resume_sha:
        description: Immutable owner-signed resume checkpoint for a stopped stage
        required: false
env:
  REQUEST_RESUME_SHA: ${{ inputs.resume_sha }}
  ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
  ONTOLIBRARY_COM_X_BUS_INSTALLED: ${{ vars.ONTOLIBRARY_COM_X_BUS_INSTALLED }}
  ONTOLIBRARY_COM_X_BUS_PENDING_INSTALL: ${{ vars.ONTOLIBRARY_COM_X_BUS_PENDING_INSTALL }}
  ONTOLIBRARY_COM_X_BUS_LEDGER_ANCHOR: ${{ vars.ONTOLIBRARY_COM_X_BUS_LEDGER_ANCHOR }}
  ONTOLIBRARY_COM_X_BUS_BINDING: ${{ vars.ONTOLIBRARY_COM_X_BUS_BINDING }}
  ONTOLIBRARY_COM_X_BUS_OWNER_SIGNERS: ${{ vars.ONTOLIBRARY_COM_X_BUS_OWNER_SIGNERS }}
jobs:
  prepare:
    if: '${{ github.event_name == ''repository_dispatch'' || github.event_name == ''workflow_dispatch'' || !contains(github.event.head_commit.message, ''Record governed operation lp-'') || contains(github.event.head_commit.message, ''-event: succeeded'') }}'
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      stage: ${{ steps.context.outputs.stage }}
      actor: ${{ steps.context.outputs.actor }}
      complete: ${{ steps.context.outputs.complete }}
      kind: ${{ steps.context.outputs.kind }}
      revision: ${{ steps.pin.outputs.revision }}
      repositories: ${{ steps.scope.outputs.repositories }}
    steps:
    - name: Capture immutable operator-approved executor
      id: pin
      env:
        REVISION: ${{ vars.ONTOLIBRARY_COM_X_BUS_EXECUTOR_REVISION }}
      run: |
        [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 1
        echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ steps.pin.outputs.revision }}
        persist-credentials: false
    - name: Reconstruct exact stage from immutable native receipts
      id: context
      env:
        READ_GH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        TRUSTED_EXECUTOR_REVISION: ${{ steps.pin.outputs.revision }}
        REQUEST_SHA: ${{ inputs.request_sha }}
        REQUEST_SEQUENCE: ${{ inputs.sequence }}
      run: |
        args=()
        if [ -n "$REQUEST_SHA" ]; then args+=(--request-sha "$REQUEST_SHA"); fi
        python3 tools/loop_controller.py prepare --executor-root "$GITHUB_WORKSPACE" "${args[@]}"
    - name: Verify credentials, installations, scopes and lifecycle before any provider
      if: steps.context.outputs.complete != 'true'
      env:
        TRUSTED_EXECUTOR_REVISION: ${{ steps.pin.outputs.revision }}
        ONTOLIBRARY_COM_X_BUS_PROJECT_SLUG: ${{ vars.ONTOLIBRARY_COM_X_BUS_PROJECT_SLUG }}
        ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
        ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_GROK_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GROK_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_GEMINI_APP_ID: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GEMINI_APP_ID }}
        ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CLAUDE_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_GROK_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GROK_APP_PRIVATE_KEY }}
        ONTOLIBRARY_COM_X_BUS_GEMINI_APP_PRIVATE_KEY: ${{ secrets.ONTOLIBRARY_COM_X_BUS_GEMINI_APP_PRIVATE_KEY }}
      run: python3 tools/runtime_preflight.py --root "$GITHUB_WORKSPACE" --context input/loop.json
    - name: Freeze publisher scope and trusted runtime scripts
      if: steps.context.outputs.complete != 'true'
      id: scope
      run: |
        python3 - <<'PY'
        import json,os,pathlib,shutil
        context=json.load(open('input/loop.json'))
        names={os.environ['GITHUB_REPOSITORY'].split('/')[1]}|{t['repository'].split('/')[1] for t in context['request']['targets']}
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('repositories='+','.join(sorted(names))+'\n')
        shutil.copytree('tools','input/runtime');shutil.copyfile('requirements-automation.lock','input/requirements.lock')
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: steps.context.outputs.complete != 'true'
      with:
        name: loop-input-${{ github.run_attempt }}
        path: input/
        if-no-files-found: error
  model:
    needs:
    - prepare
    - reserve
    if: ${{ needs.prepare.outputs.complete != 'true' && contains(fromJSON('["review","fix","verify"]'), needs.prepare.outputs.stage) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ needs.prepare.outputs.revision }}
        persist-credentials: false
    - name: Install hash-locked controller dependencies
      run: python3 -m pip install --require-hashes -r requirements-automation.lock
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: loop-input-${{ github.run_attempt }}
        path: input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: loop-model-lease-${{ github.run_attempt }}
        path: input
    - name: Check live controls and invoke the isolated provider child
      env:
        ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
        READ_GH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        TRUSTED_EXECUTOR_REVISION: ${{ needs.prepare.outputs.revision }}
        PROVIDER_API_KEY: ${{ secrets[fromJSON(vars.ONTOLIBRARY_COM_X_BUS_ROLES).agents[needs.prepare.outputs.actor].credential] }}
      run: python3 tools/loop_controller.py infer --executor-root "$GITHUB_WORKSPACE"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: loop-stage-${{ github.run_attempt }}
        path: output/stage.json
        if-no-files-found: error
    - name: Fail visibly on a blocked provider result
      run: python3 input/runtime/loop_controller.py inspect
  workflow-turn:
    needs:
    - prepare
    if: ${{ needs.prepare.outputs.complete != 'true' && needs.prepare.outputs.stage == 'workflow' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ needs.prepare.outputs.revision }}
        persist-credentials: false
    - name: Install hash-locked controller dependencies
      run: python3 -m pip install --require-hashes -r requirements-automation.lock
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: loop-input-${{ github.run_attempt }}
        path: input
    - name: Mint only this stage actor's explicit scoped credential
      id: actor
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_ID', needs.prepare.outputs.actor)] }}
        private-key: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_PRIVATE_KEY', needs.prepare.outputs.actor)] }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ needs.prepare.outputs.repositories }}
        permission-contents: write
        permission-issues: write
    - name: Execute workflow turn
      env:
        ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
        READ_GH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        TRUSTED_EXECUTOR_REVISION: ${{ needs.prepare.outputs.revision }}
        PROVIDER_API_KEY: ${{ secrets[fromJSON(vars.ONTOLIBRARY_COM_X_BUS_ROLES).agents[needs.prepare.outputs.actor].credential] }}
        EXECUTOR_GH_TOKEN: ${{ steps.actor.outputs.token }}
      run: python3 tools/loop_controller.py workflow-turn --executor-root "$GITHUB_WORKSPACE"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: loop-stage-${{ github.run_attempt }}
        path: output/stage.json
        if-no-files-found: error
  tests:
    needs: prepare
    if: ${{ needs.prepare.outputs.complete != 'true' && needs.prepare.outputs.kind == 'sandbox' }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: loop-input-${{ github.run_attempt }}
        path: input
    - name: Install reviewed hash-locked runtime before isolated source execution
      run: python3 -m pip install --require-hashes --target "$RUNNER_TEMP/approved-site" -r input/requirements.lock
    - name: Run exact candidate tests without network or credentials
      env:
        ONTOLIBRARY_COM_X_BUS_ROLES: ${{ vars.ONTOLIBRARY_COM_X_BUS_ROLES }}
      run: env -i PATH="$PATH" LANG=C.UTF-8 ONTOLIBRARY_COM_X_BUS_ROLES="$ONTOLIBRARY_COM_X_BUS_ROLES" ONTOLIBRARY_COM_X_BUS_APPROVED_SITE="$RUNNER_TEMP/approved-site" python3 input/runtime/loop_controller.py test
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: loop-stage-${{ github.run_attempt }}
        path: output/stage.json
        if-no-files-found: error
    - name: Block on a failed or unavailable sandbox
      run: python3 input/runtime/loop_controller.py inspect
  publish:
    needs:
    - prepare
    - model
    - tests
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.complete != 'true' && needs.prepare.outputs.stage != 'workflow' }}
    concurrency:
      group: ontolibrary-com-x-bus-effects-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ needs.prepare.outputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: loop-input-${{ github.run_attempt }}
        path: input
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: needs.prepare.outputs.stage != 'publish'
      with:
        name: loop-stage-${{ github.run_attempt }}
        path: output
    - name: Validate stage before minting a native publisher token
      if: needs.prepare.outputs.stage != 'publish'
      run: python3 tools/loop_controller.py inspect
    - name: Install approved semantic validators
      run: python3 -m pip install --require-hashes -r requirements-automation.lock
    - name: Mint only this stage actor's explicit scoped credential
      id: actor
      if: needs.prepare.outputs.stage != 'publish'
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_ID', needs.prepare.outputs.actor)] }}
        private-key: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_PRIVATE_KEY', needs.prepare.outputs.actor)] }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ needs.prepare.outputs.repositories }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
    - name: Mint target writer credential for candidate PR delivery
      id: delivery
      if: needs.prepare.outputs.stage == 'publish'
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_ID', needs.prepare.outputs.actor)] }}
        private-key: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_PRIVATE_KEY', needs.prepare.outputs.actor)] }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ needs.prepare.outputs.repositories }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
    - name: Mint the fixer credential for PR close
      id: fixer
      if: needs.prepare.outputs.stage != 'publish'
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_ID }}
        private-key: ${{ secrets.ONTOLIBRARY_COM_X_BUS_CHATGPT_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ needs.prepare.outputs.repositories }}
        permission-contents: write
        permission-issues: write
        permission-pull-requests: write
    - name: Independently rebuild context, execute through gate, and checkpoint next stage
      env:
        TRUSTED_EXECUTOR_REVISION: ${{ needs.prepare.outputs.revision }}
        READ_GH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        EXECUTOR_GH_TOKEN: ${{ steps.delivery.outputs.token || steps.actor.outputs.token }}
        FIXER_GH_TOKEN: ${{ steps.fixer.outputs.token }}
      run: python3 tools/loop_controller.py publish --executor-root "$GITHUB_WORKSPACE"
  reserve:
    needs: prepare
    if: ${{ needs.prepare.outputs.complete != 'true' && contains(fromJSON('["review","fix","verify"]'), needs.prepare.outputs.stage) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    concurrency:
      group: ontolibrary-com-x-bus-effects-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: zeisys-amadhavan/OntoLibrary.com-Execution-Bus
        token: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        ref: ${{ needs.prepare.outputs.revision }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: loop-input-${{ github.run_attempt }}
        path: input
    - name: Install approved semantic dependencies
      run: python3 -m pip install --require-hashes -r requirements-automation.lock
    - name: Mint only this stage actor's explicit scoped credential
      id: actor
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
      with:
        app-id: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_ID', needs.prepare.outputs.actor)] }}
        private-key: ${{ secrets[format('ONTOLIBRARY_COM_X_BUS_{0}_APP_PRIVATE_KEY', needs.prepare.outputs.actor)] }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ needs.prepare.outputs.repositories }}
        permission-contents: write
        permission-issues: write
    - name: Reserve exactly one paid inference or reuse its durable output
      env:
        TRUSTED_EXECUTOR_REVISION: ${{ needs.prepare.outputs.revision }}
        READ_GH_TOKEN: ${{ secrets.ONTOLIBRARY_COM_X_BUS_PUSH_TOKEN }}
        EXECUTOR_GH_TOKEN: ${{ steps.actor.outputs.token }}
      run: python3 tools/loop_controller.py reserve-model --executor-root "$GITHUB_WORKSPACE"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: loop-model-lease-${{ github.run_attempt }}
        path: output/model-lease.json
        if-no-files-found: error
